name: install signore
description: installs the signore client from a GitHub Packages docker image
inputs:
  signer:
    description: the signer to add to the signore config (optional)
  token:
    description: |
      GITHUB_TOKEN with access to the signore package
      Not required if the calling repository is in the `hashicorp` GitHub organization
    default: ${{ github.token }}
  version:
    description: signore cli version to install (semver supported)
    required: true
    default: v0
outputs:
  version:
    description: the version of the signore CLI that was installed
    value: ${{ steps.get-version.outputs.installed-version }}
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: login to ghcr, copy from image
      shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        GITHUB_ACTOR: ${{ github.actor }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        echo "$INPUT_TOKEN" | docker login -u "$GITHUB_ACTOR" --password-stdin ghcr.io
        docker pull "ghcr.io/hashicorp/signore:$INPUT_VERSION"
        CONTAINER_ID=$(docker create "ghcr.io/hashicorp/signore:$INPUT_VERSION")
        mkdir -p "$HOME/bin"
        docker cp "$CONTAINER_ID:/usr/bin/signore" "$HOME/bin/signore"
        docker rm -f "$CONTAINER_ID"
        echo "$HOME/bin" >> $GITHUB_PATH
    - name: template signore config
      shell: bash
      env:
        INPUT_SIGNER: ${{ inputs.signer }}
      run: |
        mkdir -p ~/.signore || true
        touch ~/.signore/config.yaml || true
        [ -n "$INPUT_SIGNER" ] && echo "signer: $INPUT_SIGNER" >> ~/.signore/config.yaml || true
    - id: get-version
      shell: bash
      run: echo "installed-version=$(signore version)" >> $GITHUB_OUTPUT
